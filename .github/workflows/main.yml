name: Update Commits Cache

on:
  schedule:
    - cron: '0 * * * *'  
  workflow_dispatch:      
  push:
    branches: [ main, master ]

jobs:
  update-commits:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Fetch commits from LinaDesk
        env:
          GITHUB_TOKEN: ${{ secrets.LINA_DESK_COMITS }}
        run: |
          echo "Fetching commits from AdonsKali/LinaDesk (dev branch)..."
          

          mkdir -p public

          curl -L \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/AdonsKali/LinaDesk/commits?sha=dev&per_page=5" \
            > public/commits-cache.json 
          
          if grep -q '"Not Found"' public/commits-cache.json; then
            echo "GitHub API error"
            cat public/commits-cache.json
            exit 1
          fi
          
          if grep -q '"message":' public/commits-cache.json && grep -q '"documentation_url"' public/commits-cache.json; then
            echo "GitHub API error:"
            cat public/commits-cache.json
            exit 1
          fi
          
          COMMIT_COUNT=$(grep -o '"sha"' public/commits-cache.json | wc -l)
          echo "Successfully fetched $COMMIT_COUNT commits"
          
          echo "{
            \"source\": \"AdonsKali/LinaDesk\",
            \"branch\": \"dev\",
            \"lastUpdated\": \"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\"
          }" > public/commits-meta.json
          
          cat public/commits-cache.json | \
            grep -E '("sha"|"message"|"date"|"name"|"html_url")' | \
            sed 's/^[[:space:]]*//' > public/commits-formatted.txt || true
          
          echo "All files saved to public/"
      
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add public/commits-cache.json public/commits-meta.json public/commits-formatted.txt
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync commits from LinaDesk/dev [skip ci]"
            git push
            echo "Changes committed"
          fi
      
      - name: Trigger Vercel Deployment
        if: success()
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d '{}' \
            "${{ secrets.VERCEL_DEPLOY_HOOK }}"
